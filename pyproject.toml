[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodyfollowing"
version = "1.0.0"
description = "Whole-person tracking with honest face-association identity continuity on CPU"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.9",
    "scipy>=1.11",
]

[project.optional-dependencies]
perception = ["ultralytics>=8.3", "torch>=2.4", "torchvision>=0.19"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = [
    "bodyfollowing",
    "bodyfollowing.association",
    "bodyfollowing.control",
    "bodyfollowing.evaluation",
    "bodyfollowing.identity",
    "bodyfollowing.perception",
    "bodyfollowing.sources",
    "bodyfollowing.tracking",
    "bodyfollowing.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
